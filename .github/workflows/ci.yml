name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proto-check:
    name: Protobuf Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install grpcio-tools
      - run: bash scripts/proto-gen.sh

  ai-engine:
    name: AI Engine Lint & Test
    runs-on: ubuntu-latest
    needs: proto-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate proto stubs
        run: |
          pip install grpcio-tools
          bash scripts/proto-gen.sh
      - name: Install dependencies
        run: pip install ruff pytest grpcio Pillow numpy
      - name: Lint
        working-directory: packages/ai-engine
        run: ruff check src/ tests/
      - name: Test
        run: python -m pytest packages/ai-engine/tests/ -v --override-ini="testpaths="

  edge-platform:
    name: Edge Platform Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        working-directory: packages/edge-platform
        run: cargo check
      - name: Test
        working-directory: packages/edge-platform
        run: cargo test

  fleet-backend:
    name: Fleet Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ruff pytest httpx fastapi uvicorn sqlalchemy asyncpg psycopg2-binary alembic pydantic python-jose[cryptography]
      - name: Lint
        working-directory: packages/fleet-view/backend
        run: ruff check src/ tests/
      - name: Test
        run: PYTHONPATH=packages/fleet-view/backend/src python -m pytest packages/fleet-view/backend/tests/ -v --override-ini="testpaths="

  fleet-frontend:
    name: Fleet Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: packages/fleet-view/frontend
        run: npm install
      - name: Build
        working-directory: packages/fleet-view/frontend
        run: npx vite build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [ai-engine, fleet-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate proto stubs
        run: |
          pip install grpcio-tools
          bash scripts/proto-gen.sh
      - name: Install dependencies
        run: pip install pytest grpcio Pillow numpy
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --override-ini="testpaths="

  qa-tests:
    name: QA Test Suite
    runs-on: ubuntu-latest
    needs: [ai-engine, fleet-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate proto stubs
        run: |
          pip install grpcio-tools
          bash scripts/proto-gen.sh
      - name: Install dependencies
        run: pip install pytest grpcio Pillow numpy httpx fastapi uvicorn pydantic python-jose[cryptography] sqlalchemy
      - name: Run QA tests
        run: python -m pytest tests/qa/ -v --override-ini="testpaths="

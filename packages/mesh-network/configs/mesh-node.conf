# B-Wave 802.11s Mesh Node Configuration
# Customize per vessel before deployment.

# Mesh network identifier — all nodes on the same vessel must share this value
mesh_id=bwave-vessel

# 5 GHz channel (36 = DFS-free, good starting point; adjust per regional regulations)
channel=36

# HT mode — use HT40+ for wider bandwidth where spectrum allows
htmode=HT40+

# Encryption — SAE (Simultaneous Authentication of Equals) provides WPA3-level security
encryption=sae

# SAE passphrase — CHANGE THIS per vessel deployment
sae_password=CHANGE_ME_PER_VESSEL

# Mesh forwarding — enable store-and-forward for multi-hop reliability
mesh_fwding=1

# Mesh path selection protocol — default HWMP (Hybrid Wireless Mesh Protocol)
mesh_hwmp_active_path_timeout=5000

# Max peer links — limit to control overhead in small vessel networks
mesh_max_peer_links=8

# TX power (dBm) — increase for steel bulkhead penetration; max depends on hardware/regulations
tx_power=23

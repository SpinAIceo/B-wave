# B-Wave Access Point Bridge Configuration
# Bridges the 802.11s mesh to the wired edge server LAN.

# Bridge interface name
bridge_name=br-bwave

# Wired interface connected to edge server
eth_interface=eth0

# Mesh interface (created by setup-mesh.sh)
mesh_interface=mesh0

# AP interface for BYOD tablet connections (hostapd-managed)
ap_interface=wlan0

# AP SSID broadcast for tablets to connect
ap_ssid=BWave-Vessel

# AP security — WPA3-SAE for tablet connections
ap_encryption=sae
ap_sae_password=CHANGE_ME_PER_VESSEL

# AP channel — match mesh channel to avoid cross-interface interference
ap_channel=36

# DHCP range for connected tablets (dnsmasq)
dhcp_range_start=192.168.10.100
dhcp_range_end=192.168.10.200
dhcp_lease_time=12h

# Edge server static IP (gateway for all mesh traffic)
edge_server_ip=192.168.10.1
subnet_mask=255.255.255.0

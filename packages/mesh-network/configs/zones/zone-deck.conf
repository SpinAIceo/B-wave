# B-Wave Mesh Zone: Main Deck (Outdoor)
# Open area, weather exposure (rain, salt spray).
# APs must be in weatherproof (IP67) enclosures.
# 5GHz for bandwidth, moderate power.

[mesh]
mesh_id=bwave-vessel
channel=44
band=5GHz
ht_mode=HT40+

[radio]
tx_power=20          # dBm — moderate (open air, good propagation)
antenna_gain=5       # dBi — weatherproof omnidirectional
country_code=KR

[security]
encryption=SAE
sae_password_file=/etc/bwave/mesh-key

[mesh_params]
mesh_hwmp_rootmode=2
mesh_gate_announcements=1
mesh_fwding=1
mesh_rssi_threshold=-78

[environment]
# AP enclosure must be IP67 rated for deck exposure
# Mount height: 2.5-3m above deck for optimal coverage
# Avoid mounting near radar mast (interference)

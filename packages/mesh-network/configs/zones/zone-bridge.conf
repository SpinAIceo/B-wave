# B-Wave Mesh Zone: Bridge / Wheelhouse
# Clean line-of-sight to main deck APs. Low interference.
# Standard power, high channel for minimal overlap with port Wi-Fi.

[mesh]
mesh_id=bwave-vessel
channel=36
band=5GHz
ht_mode=HT40+

[radio]
tx_power=15          # dBm — low power sufficient (open area, short range)
antenna_gain=3       # dBi — standard omnidirectional
country_code=KR

[security]
encryption=SAE
sae_password_file=/etc/bwave/mesh-key

[mesh_params]
mesh_hwmp_rootmode=2
mesh_gate_announcements=1
mesh_fwding=1
mesh_rssi_threshold=-80

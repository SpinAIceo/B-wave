# B-Wave Mesh Zone: Engine Room
# High electromagnetic interference from machinery.
# Steel bulkheads attenuate signal heavily — max TX power.
# Use 2.4GHz for better penetration through steel.

[mesh]
mesh_id=bwave-vessel
channel=6
band=2.4GHz
ht_mode=HT40+

[radio]
tx_power=23          # dBm — maximum for bulkhead penetration
antenna_gain=5       # dBi — directional antenna recommended
country_code=KR

[security]
encryption=SAE
sae_password_file=/etc/bwave/mesh-key

[mesh_params]
mesh_hwmp_rootmode=2
mesh_gate_announcements=1
mesh_fwding=1
mesh_rssi_threshold=-85    # relaxed threshold for noisy environment
mesh_retry_timeout=200     # ms — longer retry for high-interference zone

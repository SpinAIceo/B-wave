# B-Wave Mesh Zone: Cargo Hold
# Surrounded by steel walls, worst-case signal environment.
# Multiple APs required for coverage. 2.4GHz for penetration.
# Critical zone for CIC 2026 Cargo Securing inspections.

[mesh]
mesh_id=bwave-vessel
channel=1
band=2.4GHz
ht_mode=HT40+

[radio]
tx_power=23          # dBm — maximum for steel-enclosed space
antenna_gain=6       # dBi — directional panel antenna, aimed down hatch
country_code=KR

[security]
encryption=SAE
sae_password_file=/etc/bwave/mesh-key

[mesh_params]
mesh_hwmp_rootmode=2
mesh_gate_announcements=1
mesh_fwding=1
mesh_rssi_threshold=-88    # most relaxed — accept any usable signal
mesh_retry_timeout=300     # ms — generous retry for worst-case zone
mesh_confirm_timeout=300

[environment]
# Place APs at hatch coaming and inside hold at opposite corners
# Minimum 2 APs per hold for redundancy
# Verify coverage BEFORE cargo loading (empty hold survey)
# Re-survey after cargo stow plan changes layout

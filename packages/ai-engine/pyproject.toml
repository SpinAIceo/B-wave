[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bwave-ai-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3,<3.0",
    "ultralytics>=8.2,<9.0",
    "onnxruntime>=1.18,<2.0",
    "grpcio>=1.64,<2.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "opencv-python-headless>=4.10,<5.0",
    "numpy>=1.26,<2.0",
    "Pillow>=10.3,<11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ai_engine/inference/server.py" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
